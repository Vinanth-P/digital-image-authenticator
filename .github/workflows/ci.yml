name: ImageGuard validation
on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: instance/models
          key: imageguard-models-${{ hashFiles('model-manifest.json') }}
      - run: python scripts/download_models.py
      - run: python -m pytest
      - run: python scripts/run_benchmark.py
      - run: python scripts/evaluate_dataset.py
      - run: python scripts/seed_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ matrix.os }}
          path: |
            results/*.json
            results/*.md
  fallback:
    runs-on: ubuntu-latest
    env:
      IMAGEGUARD_MODELS_DIR: /tmp/imageguard-empty-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -m 'not neural'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t imageguard .
